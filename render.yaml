services:
  - type: web
    name: deya-clicker
    runtime: static
    repo: https://github.com/dimazmlbig-dev/Deya
    branch: main
    buildCommand: |
      echo "Static site, no build needed"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 18
