<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚗 Artemka Driver</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000; /* Черный фон, чтобы картинки смотрелись лучше */
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        /* Экран загрузки */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000 url('load.png') no-repeat center;
            background-size: cover;
            z-index: 100;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 50px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.8) 100%);
        }

        .header h1 {
            text-align: center;
            font-size: 24px;
            color: #FFD700;
            margin-bottom: 5px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 20px;
            margin: 10px 0;
        }

        .stat-value {
            display: block;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        /* Главная зона тапа */
        .game-area {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #tap-image {
            width: 80%; /* Размер картинки для тапа */
            max-width: 300px;
            cursor: pointer;
            transition: transform 0.05s alternate;
            user-select: none;
            -webkit-user-drag: none;
        }

        #tap-image:active {
            transform: scale(0.95);
        }

        /* Всплывающие цифры +1 */
        .floating-text {
            position: absolute;
            color: #FFD700;
            font-size: 32px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }

        .controls {
            padding: 20px 0;
        }

        .upgrade-btn {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            background: #FFD700;
            color: #000;
            font-weight: bold;
            font-size: 18px;
        }

        .upgrade-btn:disabled {
            background: #555;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <p>Загрузка гаража...</p>
    </div>

    <div class="game-container">
        <div class="header">
            <h1>ARTEMKA DRIVER</h1>
        </div>

        <div class="stats">
            <div style="text-align: center;">
                <span style="font-size: 12px; color: #aaa;">АРТЕМКИ</span>
                <span class="stat-value" id="coins">0</span>
            </div>
            <div style="text-align: center;">
                <span style="font-size: 12px; color: #aaa;">УРОВЕНЬ</span>
                <span class="stat-value" id="level">1</span>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <img src="tap.png" id="tap-image" alt="TAP">
        </div>

        <div class="controls">
            <button class="upgrade-btn" id="upgradeBtn">Улучшить (10 🚗)</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        let coins = parseInt(localStorage.getItem('coins')) || 0;
        let level = parseInt(localStorage.getItem('level')) || 1;
        let power = level;

        const coinsEl = document.getElementById('coins');
        const levelEl = document.getElementById('level');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const tapImg = document.getElementById('tap-image');
        const gameArea = document.getElementById('gameArea');

        // Убираем экран загрузки через 2 секунды
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
            }, 2000);
            updateUI();
        };

        function updateUI() {
            coinsEl.textContent = Math.floor(coins).toLocaleString();
            levelEl.textContent = level;
            let cost = Math.round(10 * Math.pow(1.5, level - 1));
            upgradeBtn.textContent = `Улучшить (+1 за тап) — ${cost} 🚗`;
            upgradeBtn.disabled = coins < cost;
        }

        function handleTap(e) {
            coins += power;
            
            // Создаем эффект +1
            const x = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            const y = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            
            createFloatingText(x, y, `+${power}`);
            
            // Вибрация (только для мобильных в ТГ)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            save();
            updateUI();
        }

        function createFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 40}px`;
            el.textContent = text;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 600);
        }

        upgradeBtn.onclick = () => {
            let cost = Math.round(10 * Math.pow(1.5, level - 1));
            if (coins >= cost) {
                coins -= cost;
                level++;
                power = level;
                save();
                updateUI();
            }
        };

        function save() {
            localStorage.setItem('coins', coins);
            localStorage.setItem('level', level);
        }

        // Слушатели для тапа (мышка и тач)
        tapImg.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleTap(e);
        });
        tapImg.addEventListener('click', handleTap);

    </script>
</body>
</html>
