<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚗 Artemka Driver - Web3 Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .game-container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 28px;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 2px solid gold;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
        }

        .game-area {
            position: relative;
            height: 300px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300"><rect width="500" height="300" fill="%232c3e50"/><path d="M0 150h500" stroke="%23f1c40f" stroke-width="4" stroke-dasharray="20 10"/></svg>');
            border-radius: 15px;
            margin-bottom: 25px;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
        }

        .car {
            position: absolute;
            width: 100px;
            height: 60px;
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            border-radius: 10px 20px 5px 5px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .car::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #3498db;
            border-radius: 50%;
            top: -10px;
            left: 20px;
        }

        .car::after {
            content: '🚗';
            position: absolute;
            font-size: 30px;
            top: -35px;
            left: 35px;
        }

        .click-effect {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, rgba(255,215,0,0.8) 0%, rgba(255,215,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: clickAnimation 0.5s ease-out;
        }

        @keyframes clickAnimation {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            text-align: center;
        }

        .tap-btn {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            grid-column: span 2;
            font-size: 20px;
            padding: 20px;
        }

        .upgrade-btn {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
        }

        .wallet-btn {
            background: linear-gradient(45deg, #9b59b6, #8e44ad);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .transaction-status {
            text-align: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-top: 15px;
            min-height: 20px;
        }

        .boosters {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .booster {
            background: rgba(52, 152, 219, 0.3);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            flex: 1;
            margin: 0 5px;
            border: 1px solid #3498db;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🚗 ARTEMKA DRIVER</h1>
            <p>Web3 кликер на TON Blockchain</p>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Артемки</div>
                <div class="stat-value" id="coins">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Уровень</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">За клик</div>
                <div class="stat-value" id="perClick">1</div>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <div class="car" id="car"></div>
        </div>

        <div class="buttons">
            <button class="btn tap-btn" id="tapBtn">🚗 ТАПАТЬ МАШИНКУ!</button>
            <button class="btn upgrade-btn" id="upgradeBtn">⬆️ Улучшить (10)</button>
            <button class="btn wallet-btn" id="walletBtn">🔗 Подключить TON</button>
        </div>

        <div class="transaction-status" id="status">
            Готов к игре!
        </div>

        <div class="boosters">
            <div class="booster">
                <div>🚀 Автоклик</div>
                <div id="autoClicker">0</div>
            </div>
            <div class="booster">
                <div>⚡ Множитель</div>
                <div id="multiplier">1x</div>
            </div>
            <div class="booster">
                <div>🏎️ Машинок</div>
                <div id="carsCount">1</div>
            </div>
        </div>
    </div>

    <script>
        // Игровые переменные
        let gameState = {
            coins: 0,
            level: 1,
            perClick: 1,
            autoClickers: 0,
            multiplier: 1,
            carsCount: 1,
            isWalletConnected: false,
            walletAddress: null
        };

        // DOM элементы
        const coinsEl = document.getElementById('coins');
        const levelEl = document.getElementById('level');
        const perClickEl = document.getElementById('perClick');
        const tapBtn = document.getElementById('tapBtn');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const walletBtn = document.getElementById('walletBtn');
        const gameArea = document.getElementById('gameArea');
        const car = document.getElementById('car');
        const statusEl = document.getElementById('status');

        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.setText('💾 Сохранить в TON');
        tg.MainButton.hide();

        // Загрузка сохраненной игры
        function loadGame() {
            const saved = localStorage.getItem('artemkaDriver');
            if (saved) {
                gameState = JSON.parse(saved);
                updateUI();
            }
        }

        // Сохранение игры
        function saveGame() {
            localStorage.setItem('artemkaDriver', JSON.stringify(gameState));
        }

        // Обновление интерфейса
        function updateUI() {
            coinsEl.textContent = gameState.coins;
            levelEl.textContent = gameState.level;
            perClickEl.textContent = gameState.perClick;
            
            upgradeBtn.textContent = `⬆️ Улучшить (${Math.round(10 * gameState.level)})`;
            upgradeBtn.disabled = gameState.coins < (10 * gameState.level);
            
            document.getElementById('autoClicker').textContent = gameState.autoClickers;
            document.getElementById('multiplier').textContent = `${gameState.multiplier}x`;
            document.getElementById('carsCount').textContent = gameState.carsCount;
            
            if (gameState.isWalletConnected) {
                walletBtn.textContent = `🔗 ${gameState.walletAddress.slice(0, 6)}...`;
                walletBtn.style.background = 'linear-gradient(45deg, #2ecc71, #27ae60)';
                tg.MainButton.show();
            }
        }

        // Тап по машинке
        function tap() {
            const coinsEarned = gameState.perClick * gameState.multiplier;
            gameState.coins += coinsEarned;
            
            // Анимация клика
            const rect = gameArea.getBoundingClientRect();
            const clickX = rect.width / 2;
            const clickY = rect.height / 2;
            
            const effect = document.createElement('div');
            effect.className = 'click-effect';
            effect.style.left = (clickX - 25) + 'px';
            effect.style.top = (clickY - 25) + 'px';
            gameArea.appendChild(effect);
            
            // Анимация машинки
            car.style.transform = 'translate(-50%, -50%) scale(0.9)';
            setTimeout(() => {
                car.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 100);
            
            // Удаляем эффект
            setTimeout(() => effect.remove(), 500);
            
            // Сохраняем
            saveGame();
            updateUI();
            
            // Показываем статус
            showStatus(`+${coinsEarned} 🚗 Артемок!`);
        }

        // Улучшение
        function upgrade() {
            const cost = 10 * gameState.level;
            if (gameState.coins >= cost) {
                gameState.coins -= cost;
                gameState.level++;
                gameState.perClick = Math.floor(gameState.level * 1.5);
                
                // Каждые 5 уровней добавляем машину
                if (gameState.level % 5 === 0) {
                    gameState.carsCount++;
                    showStatus('🎉 Новый автомобиль в гараже!');
                }
                
                saveGame();
                updateUI();
                showStatus('🚀 Уровень повышен!');
            }
        }

        // Подключение TON кошелька
        async function connectWallet() {
            if (typeof window.ton !== 'undefined') {
                try {
                    const accounts = await window.ton.send('ton_requestAccounts');
                    gameState.walletAddress = accounts[0];
                    gameState.isWalletConnected = true;
                    
                    showStatus('✅ Кошелек подключен!');
                    updateUI();
                    
                    // Получаем баланс TON
                    const balance = await window.ton.send('ton_getBalance');
                    showStatus(`💰 Баланс: ${parseFloat(balance).toFixed(2)} TON`);
                    
                } catch (error) {
                    showStatus('❌ Ошибка подключения');
                }
            } else {
                showStatus('📲 Установите TON Wallet');
                window.open('https://ton.org/wallets', '_blank');
            }
        }

        // Показать статус
        function showStatus(message) {
            statusEl.textContent = message;
            statusEl.style.animation = 'none';
            setTimeout(() => {
                statusEl.style.animation = 'fadeIn 0.5s';
            }, 10);
        }

        // Автокликеры
        function startAutoClickers() {
            if (gameState.autoClickers > 0) {
                setInterval(() => {
                    gameState.coins += gameState.autoClickers * gameState.multiplier;
                    saveGame();
                    updateUI();
                }, 1000);
            }
        }

        // Покупка автокликера
        function buyAutoClicker() {
            const cost = 100 * (gameState.autoClickers + 1);
            if (gameState.coins >= cost) {
                gameState.coins -= cost;
                gameState.autoClickers++;
                saveGame();
                updateUI();
                showStatus('🤖 Автокликер куплен!');
            }
        }

        // События
        tapBtn.addEventListener('click', tap);
        upgradeBtn.addEventListener('click', upgrade);
        walletBtn.addEventListener('click', connectWallet);
        gameArea.addEventListener('click', tap);

        // Автопрокликивание при долгом нажатии
        let tapInterval;
        tapBtn.addEventListener('mousedown', () => {
            tapInterval = setInterval(tap, 100);
        });
        tapBtn.addEventListener('mouseup', () => clearInterval(tapInterval));
        tapBtn.addEventListener('mouseleave', () => clearInterval(tapInterval));

        // Запуск игры
        loadGame();
        startAutoClickers();
        updateUI();

        // Для мобильных устройств
        document.addEventListener('touchstart', (e) => {
            if (e.target === tapBtn || e.target === gameArea) {
                tapInterval = setInterval(tap, 100);
            }
        }, { passive: true });

        document.addEventListener('touchend', () => clearInterval(tapInterval));
    </script>
</body>
</html>
