<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🚗 Artemka Driver</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #000;
      --panel: rgba(255,255,255,.10);
      --gold: #FFD700;
      --radius: 22px;
      --safeBottom: env(safe-area-inset-bottom, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: sans-serif;
      background: var(--bg);
      color: #fff;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* Loader */
    #loading-screen {
      position: fixed; inset: 0; background: #000 url("load.png") no-repeat center;
      background-size: cover; z-index: 999; display: flex; align-items: flex-end;
      padding: 20px 20px calc(40px + var(--safeBottom));
    }
    #loading-box { width: 100%; background: rgba(0,0,0,.6); border-radius: 16px; padding: 20px; backdrop-filter: blur(10px); }
    .bar { width: 100%; height: 8px; background: rgba(255,255,255,.1); border-radius: 10px; margin: 10px 0; overflow: hidden; }
    #loadingBar { display: block; height: 100%; width: 0%; background: var(--gold); transition: width 0.3s; }

    /* Game Interface */
    .game-container { height: 100vh; display: flex; flex-direction: column; padding: 20px; gap: 15px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { background: var(--panel); padding: 15px; border-radius: var(--radius); text-align: center; }
    .value { font-size: 24px; font-weight: 900; color: var(--gold); }
    
    .game-area { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
    #tap-image { width: 80vw; max-width: 350px; transition: transform 0.05s; user-select: none; -webkit-user-drag: none; }
    
    .btn-primary { background: var(--gold); color: #000; border: none; padding: 18px; border-radius: 15px; font-weight: 900; width: 100%; }
    
    .floating-text { position: absolute; color: var(--gold); font-size: 32px; font-weight: 900; pointer-events: none; animation: floatUp 0.6s ease-out forwards; }
    @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-120px); opacity: 0; } }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div id="loading-box">
      <div id="loading-title">Загрузка Артемки...</div>
      <div class="bar"><i id="loadingBar"></i></div>
      <div id="loadingStatus">0%</div>
    </div>
  </div>

  <div class="game-container">
    <div class="stats">
      <div class="card"><div>АРТЕМКИ</div><div class="value" id="coins">0</div></div>
      <div class="card"><div>СИЛА</div><div class="value" id="power">1</div></div>
    </div>

    <div class="game-area" id="gameArea">
      <img src="tap.png" id="tap-image" alt="TAP" />
    </div>

    <div class="controls">
      <button class="btn-primary" id="upgradeBtn">Улучшить за 10 🚗</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    let state = {
      coins: parseInt(localStorage.getItem('coins')) || 0,
      power: parseInt(localStorage.getItem('power')) || 1
    };

    const coinsEl = document.getElementById('coins');
    const powerEl = document.getElementById('power');
    const upgradeBtn = document.getElementById('upgradeBtn');
    const tapImg = document.getElementById('tap-image');

    function updateUI() {
      coinsEl.textContent = Math.floor(state.coins);
      powerEl.textContent = state.power;
      let cost = Math.round(10 * Math.pow(1.5, state.power - 1));
      upgradeBtn.textContent = `Улучшить (+1) — ${cost} 🚗`;
      upgradeBtn.disabled = state.coins < cost;
    }

    function handleTap(x, y) {
      state.coins += state.power;
      createFloatingText(x, y, `+${state.power}`);
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      
      tapImg.style.transform = 'scale(0.95)';
      setTimeout(() => tapImg.style.transform = 'scale(1)', 50);
      
      save();
      updateUI();
    }

    function createFloatingText(x, y, text) {
      const el = document.createElement('div');
      el.className = 'floating-text';
      el.style.left = `${x - 20}px`;
      el.style.top = `${y - 40}px`;
      el.textContent = text;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 600);
    }

    upgradeBtn.onclick = () => {
      let cost = Math.round(10 * Math.pow(1.5, state.power - 1));
      if (state.coins >= cost) {
        state.coins -= cost;
        state.power++;
        save();
        updateUI();
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      }
    };

    function save() {
      localStorage.setItem('coins', state.coins);
      localStorage.setItem('power', state.power);
    }

    // Поддержка мультитача
    tapImg.addEventListener('touchstart', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        handleTap(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
      }
    });

    // Прелоадер
    async function boot() {
      const bar = document.getElementById('loadingBar');
      const status = document.getElementById('loadingStatus');
      
      const images = ['load.png', 'tap.png'];
      let loaded = 0;

      for (let src of images) {
        await new Promise(res => {
          const img = new Image();
          img.onload = img.onerror = res;
          img.src = src;
        });
        loaded++;
        let p = Math.round((loaded / (images.length + 1)) * 100);
        bar.style.width = p + '%';
        status.textContent = p + '%';
      }

      // Эмуляция загрузки профиля (чтобы не висло)
      setTimeout(() => {
        bar.style.width = '100%';
        status.textContent = '100%';
        setTimeout(() => {
          document.getElementById('loading-screen').style.display = 'none';
        }, 500);
      }, 500);
      
      updateUI();
    }

    boot();
  </script>
</body>
</html>
