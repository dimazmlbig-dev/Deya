<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🚗 Artemka Driver</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

  <style>
    :root { --bg:#000; --panel:rgba(255,255,255,.10); --gold:#FFD700; --radius:22px; }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color:#fff; overflow:hidden; touch-action: manipulation; }

    #loading-screen { position:fixed; inset:0; background:#000 url("load.png") no-repeat center; background-size:cover; z-index:9999; display:flex; align-items:flex-end; padding:50px 20px; }
    .bar-container { width:100%; background:rgba(255,255,255,0.1); height:8px; border-radius:10px; margin-top:10px; overflow:hidden; }
    #loadingBar { height:100%; width:0%; background:var(--gold); transition:width .2s; display:block; }
    #loadingStatus { text-align:center; font-weight:900; }

    .leaderboard { position:absolute; left:10px; top:85px; width:150px; background:rgba(0,0,0,0.85); border:1px solid var(--gold); border-radius:15px; padding:10px; z-index:100; backdrop-filter: blur(8px); }
    .leader-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:11px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:5px; }
    .avatar { width:22px; height:22px; border-radius:50%; border:1px solid var(--gold); object-fit:cover; background:#222; }
    .leader-row b { color:var(--gold); margin-left:auto; }

    .game-container { height:100vh; display:flex; flex-direction:column; padding:20px; gap:10px; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .card { background:var(--panel); padding:15px; border-radius:var(--radius); text-align:center; border:1px solid rgba(255,255,255,0.05); }
    .value { font-size:26px; font-weight:900; color:var(--gold); }

    .status { font-size:11px; color:rgba(255,255,255,0.75); text-align:center; margin-top:-4px; white-space:pre-wrap; }
    .game-area { flex:1; display:flex; align-items:center; justify-content:center; position:relative; }
    #tap-image { width:85vw; max-width:350px; transition: transform 0.05s; user-select:none; -webkit-user-drag:none; }

    .btn-primary { background:var(--gold); color:#000; border:none; padding:18px; border-radius:18px; font-weight:900; width:100%; font-size:15px; margin-bottom:8px; cursor:pointer; }
    .btn-secondary { background:rgba(255,255,255,0.1); color:#fff; border:1px solid var(--gold); padding:12px; border-radius:15px; font-weight:900; width:100%; font-size:13px; cursor:pointer; }
    button:disabled { opacity:0.5; cursor:not-allowed; }

    .debugBox {
      position:fixed; left:10px; right:10px; bottom:10px; z-index:200;
      background:rgba(0,0,0,.75); border:1px solid rgba(255,255,255,.15);
      border-radius:14px; padding:10px; font-size:11px; display:none;
      white-space:pre-wrap;
    }
    .debugBox button { margin-top:8px; width:100%; padding:10px; border-radius:12px; border:1px solid var(--gold); background:rgba(255,255,255,.08); color:#fff; font-weight:900; }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div style="width:100%">
      <div id="loadingStatus">Запуск…</div>
      <div class="bar-container"><span id="loadingBar"></span></div>
    </div>
  </div>

  <div class="leaderboard">
    <h4 style="font-size:11px; color:var(--gold); text-align:center; margin-bottom:6px">🏆 ТОП ГАРАЖА</h4>
    <div id="leaderList">Загрузка…</div>
  </div>

  <div class="game-container">
    <div class="stats">
      <div class="card"><div>АРТЕМКИ</div><div class="value" id="coins">0</div></div>
      <div class="card"><div>СИЛА</div><div class="value" id="power">1</div></div>
    </div>

    <div class="status" id="statusLine">Синхронизация…</div>

    <div class="game-area">
      <img src="tap.png" id="tap-image" alt="TAP" />
    </div>

    <div class="controls">
      <button class="btn-primary" id="upgradeBtn">Улучшить силу</button>
      <button class="btn-secondary" id="autoBtn">Автомойка — … 🚗</button>
    </div>
  </div>

  <div class="debugBox" id="debugBox"></div>

  <script>
    const BACKEND_URL = "https://functions.yandexcloud.net/d4eo5bd6pflq6musmfba/auth/telegram";

    const firebaseConfig = {
      apiKey: "AIzaSyByjb1N0JKk0gyulwmqVe9Kq6mZ8OVuABg",
      authDomain: "artemkadriver.firebaseapp.com",
      databaseURL: "https://artemkadriver-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "artemkadriver",
      storageBucket: "artemkadriver.firebasestorage.app",
      appId: "1:234383466784:web:eb8fa37f0c37d6f343f745"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    const initData = tg?.initData || "";
    const tgUser = tg?.initDataUnsafe?.user || null;

    const statusLine = document.getElementById("statusLine");
    const debugBox = document.getElementById("debugBox");

    function showDebug(text) {
      debugBox.style.display = "block";
      debugBox.innerHTML = text + `<button id="retryBtn">Повторить авторизацию</button>`;
      document.getElementById("retryBtn").onclick = () => location.reload();
    }

    let uid = null;
    let state = { coins: 0, power: 1, auto: 0 };
    let profile = { name: "Водитель", img: "" };

    function costPower(power) { return Math.round(10 * Math.pow(1.6, power - 1)); }
    function costAuto(auto) { return Math.round(50 * Math.pow(2.2, auto)); }

    function updateUI() {
      document.getElementById("coins").textContent = Math.floor(state.coins || 0);
      document.getElementById("power").textContent = state.power || 1;

      const pCost = costPower(state.power || 1);
      const up = document.getElementById("upgradeBtn");
      up.textContent = `Улучшить (+1) — ${pCost} 🚗`;
      up.disabled = (state.coins || 0) < pCost;

      const aCost = costAuto(state.auto || 0);
      const ab = document.getElementById("autoBtn");
      ab.textContent = `Автомойка (+1/с) — ${aCost} 🚗`;
      ab.disabled = (state.coins || 0) < aCost;
    }

    function userRef(path="") {
      return db.ref("users/" + uid + (path ? "/" + path : ""));
    }

    async function ensureUserInitialized() {
      await userRef("profile").update({ name: profile.name || "Водитель", img: profile.img || "" });

      await userRef("state").transaction((s) => {
        if (s === null) return { coins: 0, power: 1, auto: 0 };
        s.coins = Number.isFinite(s.coins) ? s.coins : 0;
        s.power = Number.isFinite(s.power) ? s.power : 1;
        s.auto  = Number.isFinite(s.auto)  ? s.auto  : 0;
        if (s.power < 1) s.power = 1;
        if (s.coins < 0) s.coins = 0;
        if (s.auto  < 0) s.auto  = 0;
        return s;
      });
    }

    function subscribeMyData() {
      userRef("state").on("value", (snap) => {
        const s = snap.val();
        if (!s) return;
        state = {
          coins: Math.max(0, Number(s.coins || 0)),
          power: Math.max(1, parseInt(s.power || 1, 10)),
          auto: Math.max(0, parseInt(s.auto || 0, 10))
        };
        updateUI();
        userRef().update({ publicCoins: Math.floor(state.coins) });
      });
    }

    function subscribeLeaderboard() {
      db.ref("users").orderByChild("publicCoins").limitToLast(10).on("value", (snapshot) => {
        const list = document.getElementById("leaderList");
        list.innerHTML = "";

        const rows = [];
        snapshot.forEach(child => {
          const v = child.val() || {};
          const p = v.profile || {};
          rows.push({
            id: child.key,
            name: String(p.name || "Водитель"),
            img: String(p.img || ""),
            coins: Number(v.publicCoins || 0)
          });
        });

        rows.sort((a,b) => (b.coins||0) - (a.coins||0));

        if (!rows.length) { list.textContent = "Пока пусто"; return; }

        rows.forEach((u) => {
          const photo = u.img ? `<img src="${u.img}" class="avatar">` : `<div class="avatar" style="background:#444"></div>`;
          list.innerHTML += `
            <div class="leader-row">
              ${photo}
              <span>${u.name.slice(0,10)}${u.id === uid ? " (ты)" : ""}</span>
              <b>${Math.floor(u.coins)}</b>
            </div>`;
        });
      });
    }

    async function fetchWithTimeout(url, options, ms=12000) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), ms);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        return res;
      } finally {
        clearTimeout(t);
      }
    }

    async function loginAsGuest(reason = "") {
      await auth.signInAnonymously();
      uid = auth.currentUser.uid;
      profile = { name: "Гость", img: "" };
      await ensureUserInitialized();
      subscribeMyData();
      subscribeLeaderboard();
      statusLine.textContent = reason ? `Готово (гость): ${reason}` : "Готово (гость)";
    }

    async function login() {
      statusLine.textContent = "Авторизация…";

      // В Telegram должно быть initData, иначе сервер вернёт initData required
      if (!tg || !initData) {
        // Гостевой режим (не для продакшена, но чтобы не висло)
        await loginAsGuest("нет Telegram initData");
        return;
      }

      profile = {
        name: tgUser?.first_name || tgUser?.username || "Водитель",
        img: tgUser?.photo_url || ""
      };

      let r, data;
      try {
        r = await fetchWithTimeout(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData })
        }, 12000);
      } catch (e) {
        throw new Error("BACKEND_FETCH_FAILED: " + (e?.name || "") + " " + (e?.message || e));
      }

      try {
        data = await r.json();
      } catch {
        data = { ok:false, error:"bad_backend_json" };
      }

      if (!r.ok || !data?.token) {
        await loginAsGuest("недоступен backend");
        return;
      }

      // ВАЖНО: вот тут часто падает unauthorized-domain, если домен не добавлен в Firebase Auth
      try {
        await auth.signInWithCustomToken(data.token);
      } catch (e) {
        await loginAsGuest("ошибка Firebase custom token");
        return;
      }

      uid = auth.currentUser.uid;

      await ensureUserInitialized();
      subscribeMyData();
      subscribeLeaderboard();

      statusLine.textContent = "Синхронизировано ✅";
    }

    async function tapOnce() {
      if (!uid) return;
      await userRef("state").transaction((s) => {
        if (!s) s = { coins: 0, power: 1, auto: 0 };
        const power = Math.max(1, parseInt(s.power || 1, 10));
        const coins = Math.max(0, Number(s.coins || 0));
        s.coins = coins + power;
        s.power = power;
        s.auto = Math.max(0, parseInt(s.auto || 0, 10));
        return s;
      });
    }

    async function buyPower() {
      if (!uid) return;
      await userRef("state").transaction((s) => {
        if (!s) s = { coins: 0, power: 1, auto: 0 };
        const coins = Math.max(0, Number(s.coins || 0));
        const power = Math.max(1, parseInt(s.power || 1, 10));
        const price = costPower(power);
        if (coins < price) return;
        s.coins = coins - price;
        s.power = power + 1;
        s.auto = Math.max(0, parseInt(s.auto || 0, 10));
        return s;
      });
    }

    async function buyAuto() {
      if (!uid) return;
      await userRef("state").transaction((s) => {
        if (!s) s = { coins: 0, power: 1, auto: 0 };
        const coins = Math.max(0, Number(s.coins || 0));
        const auto = Math.max(0, parseInt(s.auto || 0, 10));
        const price = costAuto(auto);
        if (coins < price) return;
        s.coins = coins - price;
        s.auto = auto + 1;
        s.power = Math.max(1, parseInt(s.power || 1, 10));
        return s;
      });
    }

    setInterval(async () => {
      if (!uid) return;
      const aps = state.auto || 0;
      if (aps <= 0) return;
      await userRef("state").transaction((s) => {
        if (!s) return s;
        const auto = Math.max(0, parseInt(s.auto || 0, 10));
        if (auto <= 0) return s;
        s.coins = Math.max(0, Number(s.coins || 0)) + auto;
        return s;
      });
    }, 1000);

    document.getElementById("tap-image").addEventListener("pointerdown", async (e) => {
      e.preventDefault();
      const img = document.getElementById("tap-image");
      img.style.transform = "scale(0.92)";
      setTimeout(() => img.style.transform = "scale(1)", 50);
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
      await tapOnce();
    }, { passive:false });

    document.getElementById("upgradeBtn").onclick = buyPower;
    document.getElementById("autoBtn").onclick = buyAuto;

    async function boot() {
      const bar = document.getElementById("loadingBar");
      const stat = document.getElementById("loadingStatus");
      const setLoad = (p, t) => { bar.style.width = p + "%"; stat.textContent = t || (p + "%"); };

      try {
        setLoad(10, "Firebase…");
        await new Promise(r => setTimeout(r, 200));
        setLoad(35, "Telegram…");
        await new Promise(r => setTimeout(r, 200));
        setLoad(55, "Авторизация…");

        await login();

        setLoad(90, "Готовим UI…");
        updateUI();
        await new Promise(r => setTimeout(r, 120));
        setLoad(100, "Готово!");

        document.getElementById("loading-screen").style.opacity = "0";
        setTimeout(() => document.getElementById("loading-screen").style.display = "none", 450);
      } catch (e) {
        // Теперь НЕ висим — показываем точную ошибку
        const info =
          "❌ Ошибка авторизации\n\n" +
          "origin: " + location.origin + "\n" +
          "initData length: " + (initData ? initData.length : 0) + "\n" +
          "backend: " + BACKEND_URL + "\n\n" +
          String(e?.message || e) +
          "\n\nЕсли видишь unauthorized-domain — добавь домен в Firebase Auth → Authorized domains.";
        statusLine.textContent = "Ошибка. См. окно ниже.";
        showDebug(info);
      }
    }

    boot();
  </script>
</body>
</html>
